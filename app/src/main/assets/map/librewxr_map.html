function thin(a){
  if(!S.step)return a;
  const out=[];let last=Infinity;
  for(let i=a.length-1;i>=0;i--){const t=Number(a[i].time);if(last-t>=S.step*60){out.push(a[i]);last=t}}

  el.innerHTML='<div id="bar" style="background:linear-gradient(90deg,'+stops+')" role="img" aria-label="'+esc(tr('ui_odrazivost_radaru_od_10_do_80_dbz_7d801db2'))+'"></div><div id="ticks">'+t+'</div><p class="small">'+esc(tr('ui_odrazivost_radaru_v_dbz_10_az_80_je_to_orientacna_velicina_9c205545'))+'</p>';
}
const sevColor=s=>s==='Extreme'?'#ff00ff':s==='Severe'?'#ff0000':s==='Moderate'?'#ff8800':s==='Minor'?'#ffcc00':'#aaaaaa';
function refreshAlerts(){
  if(!S.map)return;
  if(S.alerts){try{S.map.removeLayer(S.alerts)}catch(e){}S.alerts=null}
  const token=++S.alertToken;
  if(!opt('alerts')){S.alertNote='';S.alertErr=false;status();return}
  const b=S.map.getBounds(),bbox=[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()].map(n=>n.toFixed(3)).join(',');
  S.alertErr=false;S.alertNote=esc(tr('ui_nacitavam_vystrahy_5e685bde'));status();
  getJson(BASE+'/v2/alerts?bbox='+bbox+'&simplify=2000').then(g=>{
    if(token!==S.alertToken||!opt('alerts'))return;
    if(!g||!Array.isArray(g.features))throw new Error(tr('ui_neocakavany_format_8c464e2c'));
    S.alerts=L.geoJSON(g,{
      style:f=>({color:sevColor((f.properties||{}).severity),weight:2,fillOpacity:.15}),
      onEachFeature:(f,layer)=>{
        const p=f.properties||{};let h='<strong>'+esc(p.title||tr('ui_vystraha_a0ff184b'))+'</strong>';
        if(Array.isArray(p.regions)&&p.regions.length)h+='<br><em>'+esc(p.regions.join(', '))+'</em>';
        if(p.severity)h+='<br>'+esc(tr('ui_zavaznost_69005d4e'))+esc(p.severity);
        if(typeof p.uri==='string'&&/^https:[/][/]/.test(p.uri))h+='<br><a href="'+esc(p.uri)+'">'+esc(tr('ui_podrobnosti_4a928310'))+'</a>';
        layer.bindPopup(h);
      }}).addTo(S.map);
    const counts={};g.features.forEach(f=>{const s=(f.properties||{}).severity;const k=['Extreme','Severe','Moderate','Minor'].includes(s)?s:'other';counts[k]=(counts[k]||0)+1});
    const dot=c=>'<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+c+';vertical-align:middle;margin:0 3px 1px 0"></span>';
    const bits=['Extreme','Severe','Moderate','Minor','other'].filter(k=>counts[k]).map(k=>dot(sevColor(k==='other'?'':k))+'\u00d7 '+counts[k]);
    S.alertErr=false;
    S.alertNote=g.features.length?esc(tr('map_alert_count_label'))+' '+bits.join(', '):esc(tr('ui_v_zobrazenej_oblasti_librewxr_nevratil_ziadne_vystrahy_pok_025fb013'));
    status();
  }).catch(e=>{if(token===S.alertToken){S.alertErr=true;S.alertNote=esc(tr('map_alerts_load_error',e&&e.message?e.message:tr('ui_chyba_b9f17311')));status()}});
}
function syncUi(){
  $('bRadar').setAttribute('aria-pressed',S.kind==='radar');$('bSat').setAttribute('aria-pressed',S.kind==='satellite');
  [['oArrows','arrows'],['oCells','cells'],['oLightning','lightning'],['oAlerts','alerts']].forEach(([id,k])=>{
    const b=$(id);b.setAttribute('aria-pressed',opt(k));b.disabled=S.kind==='satellite'&&k!=='alerts';
  });
}
function setLocation(l){
  S.loc=l;if(!S.map)return;
  S.map.setView([l.lat,l.lon],Math.max(S.map.getZoom(),6));
  if(S.marker)S.marker.setLatLng([l.lat,l.lon]);
}
function fatal(){
  setMsg(tr('ui_kniznicu_mapy_leaflet_sa_nepodarilo_nacitat_skontroluj_pri_a323dd2e'),true);
  const b=document.createElement('button');b.className='chip';b.textContent=tr('ui_skusit_znova_69d3c884');b.onclick=()=>location.reload();$('msg').appendChild(b);
}
function init(l){
  if(!window.L||window.__leafletFailed){fatal();return}
  if(S.map){setLocation(l);return}
  S.loc=l;
  const map=L.map('map',{center:[l.lat,l.lon],zoom:6,minZoom:4,maxZoom:10});
  S.map=map;map.attributionControl.setPrefix('Leaflet');
  const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:10,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'});
  osm.on('tileerror',()=>{if(!S.osmErr){S.osmErr=true;status()}});
  osm.on('tileload',()=>{if(S.osmErr){S.osmErr=false;status()}});
  osm.addTo(map);
  L.control.scale({position:'bottomleft',metric:true,imperial:false}).addTo(map);
  const icon=L.divIcon({className:'pin',iconSize:[36,48],iconAnchor:[18,46],popupAnchor:[0,-42],html:'<svg xmlns="http://www.w3.org/2000/svg" width="36" height="48" viewBox="0 0 36 48" aria-hidden="true" style="display:block;overflow:visible;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))"><path d="M18 46C15 42 2 28 2 18a16 16 0 0 1 32 0c0 10-13 24-16 28Z" fill="#e53935" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="18" cy="18" r="6" fill="#fff"/></svg>'});
  S.marker=L.marker([l.lat,l.lon],{icon,title:l.name||tr('ui_vybrana_lokalita_c1fe9cc3'),keyboard:true,zIndexOffset:1000}).addTo(map);
  let t=0;map.on('moveend',()=>{clearTimeout(t);t=setTimeout(()=>{if(opt('alerts'))refreshAlerts()},700)});
  syncUi();buildLegend();loadMeta(true);if(opt('alerts'))refreshAlerts();
  setInterval(()=>{if(!S.playing&&!document.hidden)loadMeta(false)},300000);
  [0,150,500,1200].forEach(ms=>setTimeout(fit,ms));
}
$('bRadar').onclick=()=>{if(S.kind!=='radar'){stopPlay();S.kind='radar';store.set('layer','radar');if(S.meta)rebuild(false);else syncUi()}closePanel()};
$('bSat').onclick=()=>{if(S.kind!=='satellite'){stopPlay();S.kind='satellite';store.set('layer','satellite');if(S.meta)rebuild(false);else syncUi()}closePanel()};
[['oArrows','arrows'],['oCells','cells'],['oLightning','lightning'],['oAlerts','alerts']].forEach(([id,k])=>{
  $(id).onclick=()=>{store.set('opt.'+k,opt(k)?'0':'1');syncUi();if(k==='alerts')refreshAlerts();else if(S.meta)rebuild(true)};
});
$('bLoc').onclick=()=>{if(S.loc&&S.map)S.map.setView([S.loc.lat,S.loc.lon],6)};
$('bRef').onclick=()=>loadMeta(true);
$('play').onclick=()=>{S.playing?stopPlay():startPlay()};
$('slider').addEventListener('input',e=>{$('lbl').textContent=label(Number(e.target.value))});
$('slider').addEventListener('change',e=>{stopPlay();showFrame(Number(e.target.value))});
$('opa').value=String(Math.round(S.opacity*100));$('opaV').textContent=Math.round(S.opacity*100)+' %';
$('opa').addEventListener('input',e=>{S.opacity=Number(e.target.value)/100;$('opaV').textContent=e.target.value+' %';store.set('opacity',e.target.value);Object.values(S.layers).forEach(l=>l.setOpacity(S.opacity))});
$('history').value=S.history;$('step').value=String(S.step);$('speed').value=String(S.speed);
$('history').onchange=e=>{S.history=e.target.value;store.set('history',S.history);if(S.meta)rebuild(true)};
$('step').onchange=e=>{S.step=Number(e.target.value);store.set('step',e.target.value);if(S.meta)rebuild(true)};
$('speed').onchange=e=>{const resume=S.playing,at=S.index;stopPlay();S.speed=Number(e.target.value);store.set('speed',e.target.value);if(resume)startPlay(at)};
$('play').disabled=true;syncUi();setPlayLabel();
window.addEventListener('resize',fit);
if(window.ResizeObserver){new ResizeObserver(fit).observe($('stage'))}
window.PerunMap={init:init,setLocation:setLocation};
if(window.PerunBridge&&window.PerunBridge.ready)window.PerunBridge.ready();
})();
</script></body></html>
