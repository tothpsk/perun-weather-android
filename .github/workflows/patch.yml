name: Apply patch and build

# Runs the patch scripts that a push adds to tools/patches, builds the app and commits the result
# only when the checks and the build pass. A helper for the 1.4.1 fixes; remove it before the release.

on:
  push:
    branches: ['fix/**']
    paths: ['tools/patches/**']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply the patch scripts of this push
        run: |
          set -eo pipefail
          : > "$RUNNER_TEMP/patch.log"
          git diff --name-only --diff-filter=AM HEAD~1 HEAD -- tools/patches | grep '\.py$' | sort > "$RUNNER_TEMP/scripts.txt" || true
          while read -r script; do
            echo "== $script" | tee -a "$RUNNER_TEMP/patch.log"
            python3 "$script" 2>&1 | tee -a "$RUNNER_TEMP/patch.log"
          done < "$RUNNER_TEMP/scripts.txt"
          git add -A
          git status --short | tee -a "$RUNNER_TEMP/patch.log"
      - name: Localisation and translation checks
        run: |
          set -eo pipefail
          { python3 tools/check_localization.py && python3 tools/check_translations.py; } 2>&1 | tee -a "$RUNNER_TEMP/patch.log"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK, run unit tests and lint
        run: |
          set -eo pipefail
          gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Commit the patched files
        run: |
          set -e
          if git diff --cached --quiet; then
            echo "The patch changed nothing."
            exit 0
          fi
          subject="$(git log -1 --format=%s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "${subject#Patch: }"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: perun-weather-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Report success in the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Patch of ${GITHUB_SHA::7} applied and built: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            cat "$RUNNER_TEMP/patch.log"
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "${GITHUB_REF_NAME}" --body-file "$RUNNER_TEMP/comment.md" || true
      - name: Report failure in the pull request
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Patch of ${GITHUB_SHA::7} failed, nothing was committed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            tail -n 60 "$RUNNER_TEMP/patch.log" 2>/dev/null || true
            if [ -f "$RUNNER_TEMP/build.log" ]; then
              grep -E -A 3 '^(e: |FAILURE|\* What went wrong)' "$RUNNER_TEMP/build.log" | head -n 150 || true
              echo '...'
              tail -n 25 "$RUNNER_TEMP/build.log"
            fi
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "${GITHUB_REF_NAME}" --body-file "$RUNNER_TEMP/comment.md" || true
