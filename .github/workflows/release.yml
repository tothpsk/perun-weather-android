name: Release
# Started manually from the Actions tab.
on:
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check inputs
        id: check
        shell: bash
        run: |
          set -e
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          missing=""
          for n in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            gh issue create --title "Release $VERSION: missing signing secrets" --body "Missing secrets:$missing. Add them in Settings, Secrets and variables, Actions, then run the Release workflow again." || true
            exit 1
          fi
          awk -v v="$VERSION" 'index($0, "## [" v "]")==1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then echo "CHANGELOG.md has no section for $VERSION"; exit 1; fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then echo "Release v$VERSION already exists"; exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Checks, tests and release build
        id: build
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/build.log"
          { python3 tools/check_localization.py && python3 tools/check_translations.py && gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease; } > "$LOG" 2>&1
          status=$?
          tail -n 40 "$LOG"
          if [ $status -ne 0 ]; then
            { printf 'Release %s: build failed\n\n```\n' "$VERSION"; grep -E 'error:|^e: |FAILED|What went wrong|Error:|Traceback|Assertion' "$LOG" | head -c 5000; printf '\n```\n\nTail:\n\n```\n'; tail -c 3000 "$LOG"; printf '\n```\n'; } > "$RUNNER_TEMP/report.md"
            gh issue create --title "Release $VERSION: build failed" --body-file "$RUNNER_TEMP/report.md" || true
            exit $status
          fi
      - name: Sign
        shell: bash
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/35.0.0"
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$SRC"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BT/zipalign" -p -f 4 "$SRC" "$RUNNER_TEMP/aligned.apk"
          mkdir -p dist
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "dist/Perun-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          "$BT/apksigner" verify --print-certs "dist/Perun-$VERSION.apk" | grep 'SHA-256' || true
          (cd dist && sha256sum "Perun-$VERSION.apk" > "Perun-$VERSION.apk.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: perun-release
          path: dist/*
          if-no-files-found: error
      - name: Create draft release
        shell: bash
        run: |
          gh release create "v$VERSION" "dist/Perun-$VERSION.apk" "dist/Perun-$VERSION.apk.sha256" --draft --title "Perun Weather $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA"
      - name: Report failure
        if: failure() && steps.check.outcome != 'failure' && steps.build.outcome != 'failure'
        shell: bash
        run: |
          gh issue create --title "Release $VERSION: signing or publishing failed" --body "See the failed run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
